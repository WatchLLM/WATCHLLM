[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchllm"
version = "0.1.3"
description = "Unified entry point for the WatchLLM developer toolchain — deterministic runtime governance for autonomous coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "WatchLLM" }
]
dependencies = [
  "watchllm-kernel",
  "rich>=13.7.0",
  "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
completion = ["click>=8.4.2"]

[project.scripts]
watchllm = "watchllm.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["watchllm*"]
