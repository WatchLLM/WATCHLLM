[package]
name = "watchllm-webproof-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Local non-attesting commitment engine for watchllm-webproof"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23.5", features = ["extension-module"] }
sha2 = "0.10.8"

[dev-dependencies]
proptest = "1.6.0"
serde_json = "1.0.138"
