version: "1.0.0"
session_persistence: true
routes:
  - domain: api.example.com
    prover_mode: reclaim
    sensitivity: high
    session_ttl: 3600
  - domain: example.org
    prover_mode: tlsnotary
    sensitivity: medium
    session_ttl: 900
    metadata:
      owner: example-team
aggregation:
  batch_size: 100
  timeout_seconds: 30
metadata:
  environment: development
