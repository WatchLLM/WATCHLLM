name = "watchllm-webproof-edge"
main = "src/index.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
CHAIN = "base-sepolia"
RPC_URLS = "https://sepolia.base.org"
CONFIRMATIONS = "3"
MAX_ATTEMPTS = "8"
MAX_TOTAL_FEE_WEI = "2000000000000000"
MAX_FEE_PER_GAS_WEI = "50000000000"
MAX_PRIORITY_FEE_PER_GAS_WEI = "5000000000"
ANCHOR_CONTRACT_ADDRESS = "0x0000000000000000000000000000000000000000"

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_WEBPROOF_D1_NAME"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "PROOFS"
bucket_name = "replace-with-webproof-proofs"

[[queues.producers]]
binding = "ANCHOR_QUEUE"
queue = "replace-with-webproof-anchor"

[[queues.consumers]]
queue = "replace-with-webproof-anchor"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 8
dead_letter_queue = "replace-with-webproof-anchor-dlq"
