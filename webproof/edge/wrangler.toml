name = "watchllm-webproof-edge"
main = "src/index.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
ANCHORING_MODE = "disabled"
CHAIN = "base-sepolia"
RPC_URLS = "https://sepolia.base.org"
CONFIRMATIONS = "3"
MAX_ATTEMPTS = "8"
MAX_EXECUTION_FEE_WEI = "2000000000000000"
MAX_FEE_PER_GAS_WEI = "50000000000"
MAX_PRIORITY_FEE_PER_GAS_WEI = "5000000000"
ANCHOR_LEASE_MS = "120000"
ANCHOR_CONTRACT_ADDRESS = "0x0000000000000000000000000000000000000000"

[[d1_databases]]
binding = "DB"
database_name = "watchllm-webproof"
database_id = "f4ab2056-0ead-4a4a-9166-ca8d4eba9b4c"

[[r2_buckets]]
binding = "PROOFS"
bucket_name = "watchllm-webproof-proofs"

[[queues.producers]]
binding = "ANCHOR_QUEUE"
queue = "watchllm-webproof-anchor"

[[queues.consumers]]
queue = "watchllm-webproof-anchor"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 8
dead_letter_queue = "watchllm-webproof-anchor-dlq"
