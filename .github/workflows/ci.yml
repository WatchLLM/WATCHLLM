name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  webproof-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webproof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install, test, and build SDK
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -v
          python -m build

  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e . pytest build
      - name: Run tests
        run: python -m pytest -v
      - name: Build package
        run: python -m build

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked
      - name: Validate Python package
        run: |
          python -m pip install -e . build
          python -c "import watchllm_runtime"
          python -m build

  replay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: replay/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build frontend
        run: npm run build:frontend
      - name: Audit dependencies
        run: npm audit --audit-level=high

  reliability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reliability
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install -e ../kernel
          python -m pip install -e . build
          python -m pytest -v
          python -m build

  klyd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klyd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install -e . pytest build
          python -m pytest -v
          python -m build

  klyd-harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klyd_harness_repo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install -e . pytest build
          python -m pytest -v test_db.py
          python -m build

  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install -e . pytest build
          python -m pytest -v
          python -m build

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install local kernel and CLI
        run: |
          python -m pip install -e ./kernel
          python -m pip install --no-deps -e ./cli
          python -m pip install rich prompt-toolkit build
      - name: Validate entry point and package
        run: |
          watchllm --help
          python -m build cli

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install local kernel and benchmark package
        run: |
          python -m pip install -e ./kernel
          python -m pip install -e ./benchmarks build
      - name: Validate benchmark registry and package
        run: |
          watchllm-benchmarks --help
          python -c "from benchmarks.suites import load_suites; assert load_suites()"
          python -m build benchmarks

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check and bundle
        run: |
          npx tsc --noEmit
          npm run bundle
      - name: Audit dependencies
        run: npm audit --audit-level=high

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
