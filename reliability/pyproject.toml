[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchllm-reliability"
version = "0.1.0"
description = "Stress-testing and adversarial evaluation framework for autonomous coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "WatchLLM" }
]
keywords = [
  "watchllm",
  "reliability",
  "adversarial-testing",
  "prompt-injection"
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Security"
]
dependencies = [
  "pytest>=7.0.0",
  "click>=8.0",
  "pyyaml>=6.0",
]

[project.scripts]
reliability-stress = "reliability.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
