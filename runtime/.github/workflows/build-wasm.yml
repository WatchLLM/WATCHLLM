name: Build WebAssembly

on:
  push:
    branches: [main]
    paths:
      - 'runtime/crates/**'
      - 'runtime/Cargo.toml'
      - 'runtime/Cargo.lock'
      - 'runtime/.github/workflows/build-wasm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/crates/**'
      - 'runtime/Cargo.toml'
      - 'runtime/Cargo.lock'
      - 'runtime/.github/workflows/build-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build Wasm crate
        run: cargo build --release --locked --target wasm32-unknown-unknown -p watchllm-wasm
